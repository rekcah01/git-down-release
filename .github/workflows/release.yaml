```yaml
name: Download and Release

on:
  push:
    branches:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aria2 and wget
        run: sudo apt-get install -y aria2 wget zip

      - name: Extract URL from commit message
        id: parse
        run: |
          set -euo pipefail

          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -qP '^release:'; then
            URL=$(echo "$MSG" | grep -oP 'release:\s*\K.*' | tr -d '[:space:]')
          else
            echo "⏭️ Not a release trigger — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Download file
        if: steps.parse.outputs.skip == 'false'
        id: download
        run: |
          set -euo pipefail

          URL="${{ steps.parse.outputs.url }}"
          mkdir -p tmp_downloads

          echo "⬇️ Trying aria2c: $URL"
          if aria2c \
              --split=4 \
              --max-connection-per-server=4 \
              --min-split-size=20M \
              --max-tries=5 \
              --retry-wait=10 \
              --dir="tmp_downloads" \
              "$URL"; then
            echo "✅ aria2c succeeded"
          else
            echo "⚠️ aria2c failed — falling back to wget"
            if wget \
                --tries=5 \
                --waitretry=10 \
                --timeout=60 \
                --continue \
                --show-progress \
                -P "tmp_downloads" \
                "$URL"; then
              echo "✅ wget succeeded"
            else
              echo "❌ Both aria2c and wget failed"
              exit 1
            fi
          fi

          FILENAME=$(ls tmp_downloads/)
          FILEPATH="tmp_downloads/$FILENAME"
          SIZE=$(stat -c%s "$FILEPATH")
          echo "📦 File: $FILENAME ($(( SIZE / 1024 / 1024 ))MB)"

          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "filepath=$FILEPATH" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Split if needed
        if: steps.parse.outputs.skip == 'false'
        id: split
        run: |
          set -euo pipefail

          FILEPATH="${{ steps.download.outputs.filepath }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          SIZE="${{ steps.download.outputs.size }}"
          LIMIT=$((1900 * 1024 * 1024))

          mkdir -p tmp_splits release_files

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "✂️ File is $(( SIZE / 1024 / 1024 ))MB — splitting into 1.9GB zip parts..."

            SPLIT_SOURCE="$FILEPATH"
            SPLIT_BASENAME="$FILENAME"
            if [[ "$FILENAME" =~ \.zip$ ]]; then
              RENAMED="tmp_downloads/${FILENAME%.zip}.bin"
              mv "$FILEPATH" "$RENAMED"
              SPLIT_SOURCE="$RENAMED"
              SPLIT_BASENAME="${FILENAME%.zip}.bin"
            fi

            zip -s 1900m "tmp_splits/${SPLIT_BASENAME}.zip" -j "$SPLIT_SOURCE"

            PART_COUNT=$(ls tmp_splits/ | wc -l)
            echo "✅ Split into $PART_COUNT parts"
            ls -lh tmp_splits/

            mv tmp_splits/* release_files/
          else
            echo "✅ File is under 1.9GB — no splitting needed"
            cp "$FILEPATH" "release_files/$FILENAME"
          fi

          rm -rf tmp_downloads tmp_splits

      - name: Create GitHub Release and upload files
        if: steps.parse.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILENAME="${{ steps.download.outputs.filename }}"
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          TITLE="Download: $FILENAME"
          PART_COUNT=$(ls release_files/ | wc -l)
          SPLIT_BASENAME="${FILENAME%.zip}.bin"
          DOWNLOAD_URL="${{ steps.parse.outputs.url }}"

          if [ "$PART_COUNT" -gt 1 ]; then
            cat > release_notes.md << EOF_NOTES
          Downloaded from: ${DOWNLOAD_URL}

          Split into ${PART_COUNT} parts of 1.9GB each.

          To reassemble on Windows:
          1. Download all parts (.zip + .z01 .z02 ...)
          2. Right-click the .zip part and extract with 7-Zip or WinRAR
          3. It will automatically reassemble all parts

          To reassemble on Linux/Mac:
          zip -F ${SPLIT_BASENAME}.zip --fix --out full.zip
          unzip full.zip
          EOF_NOTES
          else
            cat > release_notes.md << EOF_NOTES
          Downloaded from: ${DOWNLOAD_URL}
          EOF_NOTES
          fi

          echo "🏷️ Creating release: $TAG"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            release_files/*

          echo "✅ Release created: $TAG"
          echo "📎 Uploaded $PART_COUNT file(s)"
          rm -rf release_files release_notes.md
```
