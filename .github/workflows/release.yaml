name: Download and Release

on:
  push:
    branches:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aria2 and wget
        run: sudo apt-get install -y aria2 wget zip

      - name: Extract URL from commit message
        id: parse
        run: |
          set -euo pipefail

          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -qP '^release:'; then
            URL=$(echo "$MSG" | grep -oP 'release:\s*\K.*' | tr -d '[:space:]')
          else
            echo "⏭️ Not a release trigger — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Download file
        if: steps.parse.outputs.skip == 'false'
        id: download
        run: |
          set -euo pipefail

          URL="${{ steps.parse.outputs.url }}"
          mkdir -p tmp_downloads

          echo "⬇️ Trying aria2c: $URL"
          if aria2c \
              --split=4 \
              --max-connection-per-server=4 \
              --min-split-size=20M \
              --max-tries=5 \
              --retry-wait=10 \
              --dir="tmp_downloads" \
              "$URL"; then
            echo "✅ aria2c succeeded"
          else
            echo "⚠️ aria2c failed — falling back to wget"
            if wget \
                --tries=5 \
                --waitretry=10 \
                --timeout=60 \
                --continue \
                --show-progress \
                -P "tmp_downloads" \
                "$URL"; then
              echo "✅ wget succeeded"
            else
              echo "❌ Both aria2c and wget failed"
              exit 1
            fi
          fi

          FILENAME=$(ls tmp_downloads/)
          FILEPATH="tmp_downloads/$FILENAME"
          SIZE=$(stat -c%s "$FILEPATH")
          echo "📦 File: $FILENAME ($(( SIZE / 1024 / 1024 ))MB)"

          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "filepath=$FILEPATH" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Split if needed
        if: steps.parse.outputs.skip == 'false'
        id: split
        run: |
          set -euo pipefail

          FILEPATH="${{ steps.download.outputs.filepath }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          SIZE="${{ steps.download.outputs.size }}"
          LIMIT=$((1900 * 1024 * 1024))

          mkdir -p release_files

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "✂️ File is $(( SIZE / 1024 / 1024 ))MB — splitting into 1.9GB parts..."

            # use split command — cleaner than zip for large raw files
            # produces: filename.part.aa, filename.part.ab, filename.part.ac ...
            split \
              --bytes=1900m \
              --suffix-length=3 \
              --numeric-suffixes=1 \
              "$FILEPATH" \
              "release_files/${FILENAME}.part."

            PART_COUNT=$(ls release_files/ | wc -l)
            echo "✅ Split into $PART_COUNT parts"
            ls -lh release_files/
          else
            echo "✅ File is under 1.9GB — no splitting needed"
            cp "$FILEPATH" "release_files/$FILENAME"
          fi

          rm -rf tmp_downloads

      - name: Create GitHub Release and upload files
        if: steps.parse.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILENAME="${{ steps.download.outputs.filename }}"
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          TITLE="Download: $FILENAME"
          NOTES="Downloaded from: ${{ steps.parse.outputs.url }}"

          PART_COUNT=$(ls release_files/ | wc -l)
          if [ "$PART_COUNT" -gt 1 ]; then
            NOTES="$NOTES
            
📦 Split into $PART_COUNT parts of 1.9GB each.

**To reassemble:**
\`\`\`bash
cat ${FILENAME}.part.* > ${FILENAME}
\`\`\`"
          fi

          echo "🏷️ Creating release: $TAG"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            release_files/*

          echo "✅ Release created: $TAG"
          echo "📎 Uploaded $PART_COUNT file(s)"
          rm -rf release_files
